name: Build personal installers
run-name: v0.19.3 LAN fix · ${{ inputs.platform }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '构建平台（all 为 Apple Silicon 和 Windows x64）'
        type: choice
        required: true
        default: all
        options: [all, macos-aarch64, macos-x86_64, windows-x86_64]

permissions:
  contents: read

concurrency:
  group: personal-build-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            all) TARGETS='[{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"}]' ;;
            macos-aarch64) TARGETS='[{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"}]' ;;
            macos-x86_64) TARGETS='[{"os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg"}]' ;;
            windows-x86_64) TARGETS='[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"}]' ;;
            *) exit 1 ;;
          esac
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.targets) }}
    env:
      APP_ENV: production
      VITE_APP_ENV: production
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - name: Prefer the rustup toolchain
        shell: bash
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: personal-v0193-${{ matrix.target }}
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Validate network regressions
        run: cargo test --locked -p uc-infra --lib -- addr_filter hairpin
      - name: Validate updater policy
        run: cargo test --locked -p uc-tauri --lib commands::updater::tests
      - name: Build installer with bundled daemon
        run: bun run tauri:build:local --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Record source revision and checksums
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/collect-local-installers.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: UniClipboard-v0.19.3-lan.1-${{ matrix.target }}
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 30
