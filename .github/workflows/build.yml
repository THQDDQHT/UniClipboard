name: Build personal installers
run-name: UniClipboard ${{ github.ref_name }} · ${{ inputs.platform || 'all' }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: '构建平台（all 为 Apple Silicon 和 Windows x64）'
        type: choice
        required: true
        default: all
        options: [all, macos-aarch64, macos-x86_64, windows-x86_64]

permissions:
  contents: read

concurrency:
  group: personal-build-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - id: targets
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          case "$PLATFORM" in
            all) TARGETS='[{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"}]' ;;
            macos-aarch64) TARGETS='[{"os":"macos-latest","target":"aarch64-apple-darwin","bundles":"app,dmg"}]' ;;
            macos-x86_64) TARGETS='[{"os":"macos-latest","target":"x86_64-apple-darwin","bundles":"app,dmg"}]' ;;
            windows-x86_64) TARGETS='[{"os":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis"}]' ;;
            *) exit 1 ;;
          esac
          echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.targets) }}
    env:
      APP_ENV: production
      VITE_APP_ENV: production
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          targets: ${{ matrix.target }}
      - name: Prefer the rustup toolchain
        shell: bash
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: personal-v0193-${{ matrix.target }}
      - name: Read app version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Install locked frontend dependencies
        run: bun install --frozen-lockfile
      - name: Validate network regressions
        run: cargo test --locked -p uc-infra --lib -- addr_filter hairpin
      - name: Validate updater policy
        run: cargo test --locked -p uc-tauri --lib commands::updater::tests
      - name: Build installer with bundled daemon
        run: bun run tauri:build:local --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Package Windows portable archive
        if: runner.os == 'Windows'
        run: python scripts/build-windows-portable.py --target ${{ matrix.target }}
      - name: Record source revision and checksums
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/collect-local-installers.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: UniClipboard-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: dist-installers/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          # Only the macOS dmg and the Windows portable zip are published (not the NSIS installer).
          find artifacts -type f \( -name '*.dmg' -o -name '*-portable.zip' \) -exec cp {} release/ \;
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*-portable.zip)
          if [ "${#dmgs[@]}" -eq 0 ]; then echo "::error::No .dmg found in build artifacts"; exit 1; fi
          if [ "${#zips[@]}" -eq 0 ]; then echo "::error::No -portable.zip found in build artifacts"; exit 1; fi
          (cd release && sha256sum -- *.dmg *-portable.zip > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            "${dmgs[@]}" "${zips[@]}" release/SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --verify-tag \
            --title "UniClipboard $GITHUB_REF_NAME" \
            --notes "局域网个人版；macOS Apple Silicon 下载 .dmg，Windows 下载便携版 .zip，解压即用；自动更新已关闭"
